<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-page student-theme">
    <h1 class="main-title2">Student </h1>
    <h1 class="main-title3"> Register</h1>
    <main class="auth-layout">
        

        <section class="auth-card wide-card">
            <h2>Create Account</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="flash-box">
                        {% for message in messages %}
                            <p>{{ message }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" enctype="multipart/form-data" class="auth-form two-column">
                <label>Full Name
                    <input type="text" name="name" required>
                </label>

                <label>Username
                    <input type="text" name="username" required>
                </label>

                <label>Roll Number
                    <input type="text" name="roll_number" required>
                </label>

                <label>Email
                    <input type="email" name="email" required>
                </label>

                <label>Phone
                    <input type="text" name="phone" required>
                </label>

                <label>Department
                    <select name="department" required>
                        <option value="">Select department</option>
                        {% for department in departments %}
                            <option value="{{ department.name }}">{{ department.name }}</option>
                        {% endfor %}
                    </select>
                </label>

                <label>Study Year
                    <input type="text" name="study_year" required>
                </label>

                <label>Gender
                    <select name="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </label>

                <label>CGPA
                    <input type="text" name="cgpa" required>
                </label>

                <label>Password
                    <input type="password" name="password" required>
                </label>

                <label>Confirm Password
                    <input type="password" name="confirm_password" required>
                </label>

                <label class="full-width">Resume
                    <input type="file" name="resume">
                </label>

                <button class="full-width" type="submit">Register Student</button>
            </form>
            <a class="simple-link" href="{{ url_for('student_login') }}">Already registered? Login here</a>
        </section>
    </main>
</body>
</html>
