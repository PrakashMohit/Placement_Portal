<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-page company-theme">
    <main class="auth-layout">
        <h1 class="main-title2">Company </h1>
    <h1 class="main-title3"> Register</h1>
        
        <section class="auth-card wide-card">
            <h2>Create Company Account</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="flash-box">
                        {% for message in messages %}
                            <p>{{ message }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" class="auth-form two-column">
                <label>Company Name
                    <input type="text" name="name" required>
                </label>

                <label>Username
                    <input type="text" name="username" required>
                </label>

                <label>Email
                    <input type="email" name="email" required>
                </label>

                <label>Phone
                    <input type="text" name="phone" required>
                </label>

                <label>Website
                    <input type="text" name="website">
                </label>

                <label>Password
                    <input type="password" name="password" required>
                </label>

                <label>Confirm Password
                    <input type="password" name="confirm_password" required>
                </label>

                <label class="full-width">Company Details
                    <textarea name="details" rows="5" required></textarea>
                </label>

                <button class="full-width" type="submit">Register Company</button>
            </form>
            <a class="simple-link" href="{{ url_for('company_login') }}">Already registered? Login here</a>
        </section>
    </main>
</body>
</html>
